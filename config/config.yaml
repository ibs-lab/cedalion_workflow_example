dataset:
  root_dir : "resources/rawdata"
  derivatives_dir: "results"
  subjects : ["01", "02"] #, "03", "04", "05", "06", "07", "08", "09"]
  tasks: ["FRESHMOTOR"]
  sessions: ["left2s", "right2s"] #, "left3s", "right3s"]

# Head model used by all DOT steps: either a standard atlas head model ("colin27" or
# "icbm152") or the path to a head model manifest (headmodel_manifest.json) of an
# individual head. {subject}, {session} and {task} placeholders in the path are
# filled in by the workflow for each recording, e.g.:
#   head_model: "/path/to/heads/sub-{subject}/headmodel_manifest.json"
# An unscaled standard head model is shared by all recordings, so its sensitivity
# matrix is computed only once.
head_model: "colin27"

preprocess:
  keep_intermediate : True
  normalize_landmarks: True

  methods:
    - {name: amp_repaired,  method: repair_amp}

    - name: amp_pruned
      method: prune
      params:
        snr_thresh: 5
        sd_thresh_min: "1 mm"
        sd_thresh_max: "45 mm"
        amp_thresh_min: 0.001
        amp_thresh_max: 0.84
        window_length: "5 s"
        sci_thresh: 0.6
        psp_thresh: 0.1
        perc_time_clean_thresh: 0.6
        use_sci: true
        use_psp: false

    - {name: gvtd_before, method: gvtd, params: {stat_type: histogram_mode, n_std: 10}}

    - {name: od,  method: int2od}
    - {name: od_tddr, method: tddr}
    - {name: od_wavelet, method: wavelet}
    #- {name: od_spline, method: spline, params: {p: 0.99}}
    #- {name: od_spline_sg, method: spline_sg, params: {p: 1, frame_size: "10 s"}}
    #- {name: od_pca, method: pca, params: {n_sv: 0.97}}
    #- {name: od_pca_recurse, method: pca_recurse, params: {n_sv: 0.97, max_iter: 5}}

    - {name: gvtd_after, method: gvtd_from_od, params: {stat_type: histogram_mode, n_std: 10}}
    - {name: od_variance_corrected, method: log_variance}

    - {name: od_ff,  method: freq_filter, params: {fmin: "0.01 Hz", fmax: "0.5 Hz"}}
    - {name: conc,  method: od2conc}

hrf_estimation:
  t_pre: "2 s"
  t_post: "10 s"
  t_delta: "1 s"
  t_std: "1 s"
  ts_name: "od_03"
  noise_model: "ar_irls"
  ar_order: 60
  trial_types: ["motor"]
  drift_order: 3
  distance_threshold: "20 mm"
  use_short_separation: true

blockaverage:
  t_pre : "2 s"
  t_post : "30 s"
  ts_name : "conc"

register_probe:
  method: "spring_relax"
  # Optionally scale the head model to the subject's head:
  # scale_to: "landmarks"   # fit to the probe's landmarks
  # scale_to: "headsize"    # fit to head size measurements:
  # circumference: "56 cm"
  # nz_cz_iz: "35 cm"
  # lpa_cz_rpa: "36 cm"

sensitivity:
  method: "nirfaster"

image_reconstruction:
  timeseries: "od_04"

  # Measurement regularization. When alpha_meas is null, estimate it from
  # the measurement variance using alpha_meas_k.
  alpha_meas: null
  alpha_meas_k: 0.01
  alpha_spatial: 0.001
  lambda_R_conc: null
  apply_c_meas: true

  # ImageRecon options: "mua", "conc", or "mua2conc".
  recon_mode: "mua2conc"
  brain_only: false

  # Set to a Gaussian configuration to enable spatial basis functions.
  spatial_basis_functions: null
  # spatial_basis_functions:
  #   type: "gaussian"
  #   mask_threshold: -2
  #   threshold_brain: "1 mm"
  #   threshold_scalp: "5 mm"
  #   sigma_brain: "1 mm"
  #   sigma_scalp: "5 mm"
  #   verbose: false

  dOD_thresh: 0.001

image_blockaverage:
  t_pre: "2 s"
  t_post: "30 s"
  trial_types: ["motor"]

image_feature:
  t_pre: "2 s"
  t_post: "20 s"
  feature: "auc_diff"
  baseline_window: ["-2 s", "0 s"]
  activity_window: ["5 s", "15 s"]
  trial_types: ["motor"]

image_statistics:
  alpha: 0.01
  fdr_method: "indep"

image_visualization:
  trial_type: "motor"

image_group_average_visualization:
  trial_type: "motor"
