dataset:
  root_dir : "resources/rawdata"
  derivatives_dir: "results"
  subjects : ["01", "02", "03", "04", "05", "06", "07", "08", "09"]
  tasks: ["FRESHMOTOR"]
  sessions: ["left2s", "left3s", "right2s", "right3s"]


preprocess:
  keep_intermediate : True
  normalize_landmarks: True

  methods:
    - {name: amp_repaired,  method: repair_amp}

    - name: amp_pruned
      method: prune
      params:
        snr_thresh: 5
        sd_thresh_min: "1 mm"
        sd_thresh_max: "45 mm"
        amp_thresh_min: 0.001
        amp_thresh_max: 0.84
        window_length: "5 s"
        sci_thresh: 0.6
        psp_thresh: 0.1
        perc_time_clean_thresh: 0.6
        use_sci: true
        use_psp: false

    - {name: gvtd_before, method: gvtd, params: {stat_type: histogram_mode, n_std: 10}}

    - {name: od,  method: int2od}
    - {name: od_tddr, method: tddr}
    - {name: od_wavelet, method: wavelet}
    #- {name: od_spline, method: spline, params: {p: 0.99}}
    #- {name: od_spline_sg, method: spline_sg, params: {p: 1, frame_size: "10 s"}}
    #- {name: od_pca, method: pca, params: {n_sv: 0.97}}
    #- {name: od_pca_recurse, method: pca_recurse, params: {n_sv: 0.97, max_iter: 5}}

    - {name: gvtd_after, method: gvtd_from_od, params: {stat_type: histogram_mode, n_std: 10}}
    - {name: od_variance_corrected, method: log_variance}

    - {name: od_ff,  method: freq_filter, params: {fmin: "0.01 Hz", fmax: "0.5 Hz"}}
    - {name: conc,  method: od2conc}

blockaverage:
  t_pre : "2 s"
  t_post : "30 s"
  ts_name : "conc"



sensitivity:
  # Standard atlas head model. Supported names include "colin27" and "icbm152".
  # Standard models use one shared sensitivity matrix across the dataset.
  head_model: "colin27"

  # For an individualized/non-standard head model, replace the line above with
  # a configuration such as the following. {subject}, {session}, and {task}
  # placeholders are resolved by the workflow for each recording.
  #
  # For the full parcel-based workflow, coordinates_file should describe the
  # same brain surface and include a "parcel" column.
  #
  # head_model:
  #   type: "surfaces"
  #   segmentation_dir: "/path/to/heads/sub-{subject}"
  #   brain_surface_file: "/path/to/heads/sub-{subject}/brain.obj"
  #   scalp_surface_file: "/path/to/heads/sub-{subject}/scalp.obj"
  #   landmarks_ras_file: "/path/to/heads/sub-{subject}/landmarks.json"
  #   coordinates_file: "/path/to/heads/sub-{subject}/brain_vertex_coordinates.csv"
  #
  # A head model can also be constructed directly from a segmentation:
  #
  # head_model:
  #   type: "segmentation"
  #   segmentation_dir: "/path/to/heads/sub-{subject}"
  #   landmarks_ras_file: "/path/to/heads/sub-{subject}/landmarks.json"
  #
  # Segmentation-only models can be used for sensitivity and vertex-space
  # reconstruction, but parcel-based downstream analysis requires parcel labels.

image_reconstruction:
  timeseries: "od_04"

  # Measurement regularization. When alpha_meas is null, estimate it from
  # the measurement variance using alpha_meas_k.
  alpha_meas: null
  alpha_meas_k: 0.01
  alpha_spatial: 0.001
  lambda_R_conc: null
  apply_c_meas: true

  # ImageRecon options: "mua", "conc", or "mua2conc".
  recon_mode: "mua2conc"
  brain_only: false

  # Set to a Gaussian configuration to enable spatial basis functions.
  spatial_basis_functions: null
  # spatial_basis_functions:
  #   type: "gaussian"
  #   head_model: "colin27"
  #   mask_threshold: -2
  #   threshold_brain: "1 mm"
  #   threshold_scalp: "5 mm"
  #   sigma_brain: "1 mm"
  #   sigma_scalp: "5 mm"
  #   verbose: false

  dOD_thresh: 0.001

image_blockaverage:
  t_pre: "2 s"
  t_post: "30 s"
  trial_types: ["motor"]

image_feature:
  t_pre: "2 s"
  t_post: "20 s"
  feature: "auc_diff"
  baseline_window: ["-2 s", "0 s"]
  activity_window: ["5 s", "15 s"]
  trial_types: ["motor"]

image_statistics:
  alpha: 0.01
  fdr_method: "indep"

image_visualization:
  head_model: "colin27"
  trial_type: "motor"

image_group_average_visualization:
  trial_type: "motor"
